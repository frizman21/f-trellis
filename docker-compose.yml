services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    image: ruby:3.3
    working_dir: /app
    tty: true
    stdin_open: true
    # libvips is the shared library ruby-vips links against, and the stock
    # ruby:3.3 image does not ship it. Rails loads ruby-vips during boot, so
    # without this the dev container dies before serving anything. The
    # production Dockerfile and CI install it their own way; this is the dev
    # equivalent, kept inline rather than as a build so the service stays on
    # the stock image.
    # Probe the shared library rather than a package name: Debian renamed it
    # libvips42 -> libvips42t64 in the time64 transition, so a dpkg -s check
    # would silently re-apt on every start.
    command: bash -c "(ldconfig -p | grep -q libvips || (apt-get update -qq && apt-get install --no-install-recommends -y libvips)) && bundle install && bin/rails db:prepare && bundle exec rerun --pattern '{Gemfile.lock,db/schema.rb}' --signal SIGTERM -- bin/rails server -b 0.0.0.0 -p 3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432
      RAILS_ENV: development
      BUNDLE_PATH: /bundle
      # Mirrored into the container so generated URLs (e.g. mailer links)
      # point at the host port this instance is actually published on.
      WEB_PORT: ${WEB_PORT:-3001}
    volumes:
      - .:/app
      - bundle:/bundle
    ports:
      # Host port is configurable so two checkouts can run side by side.
      # Set WEB_PORT in .env (or the shell) to override the 3001 default.
      - "${WEB_PORT:-3001}:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  bundle:
