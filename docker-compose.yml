services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    image: ruby:3.3
    working_dir: /app
    tty: true
    stdin_open: true
    command: bash -c "bundle install && bin/rails db:prepare && bundle exec rerun --pattern '{Gemfile.lock,db/schema.rb}' --signal SIGTERM -- bin/rails server -b 0.0.0.0 -p 3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432
      RAILS_ENV: development
      BUNDLE_PATH: /bundle
    volumes:
      - .:/app
      - bundle:/bundle
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  bundle:
