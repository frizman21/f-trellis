# Production compose for single-host deployment.
#
# Prerequisites:
#   1. Copy `.env.production.example` to `.env.production` and fill in the secrets.
#   2. A Postgres server reachable on the host at 5432 (see "Database" below).
#   3. `docker compose -f docker-compose.production.yml --env-file .env.production build`
#   4. `docker compose -f docker-compose.production.yml --env-file .env.production up -d`
#
# Topology:
#   nginx (host port APP_HTTP_PORT) -> app (Thruster, container port 80) -> Puma
#   worker  (Solid Queue) runs alongside, sharing the same image as app.
#   Postgres is NOT part of this stack — it runs on the host.
#
# TLS:
#   The bundled nginx terminates plain HTTP. For TLS, either (a) put a TLS
#   terminator in front of nginx (Cloudflare Tunnel, an external LB), or
#   (b) extend `docker/nginx/default.conf` with a 443 server block and mount
#   certs into the nginx container.
#
# Database:
#   The bundled `postgres` service is commented out below; the app connects to
#   a Postgres running on the host via `host.docker.internal`. That server must
#   have role f_dod_user with a password matching APP_DATABASE_PASSWORD, owning
#   f_dod_production and the _cache / _queue / _cable databases. Because
#   Postgres is external, `db/postgres-init/` no longer runs — those three
#   extra databases have to be created by hand.
#
#   On Docker Desktop for Mac, host.docker.internal is proxied to the host's
#   loopback, so a server listening on the default listen_addresses='localhost'
#   is reachable and the connection arrives as 127.0.0.1. On Linux the host
#   gateway is a real interface, so a deployment there additionally needs
#   listen_addresses to cover it plus a matching pg_hba.conf line.
#
# Database persistence:
#   Postgres data lives on the host, outside Docker's lifecycle entirely, so
#   `docker compose down -v` no longer touches it. Back it up with the host's
#   own pg_dump. See README "Production deployment".
#
# Database migrations on every start:
#   The `app` service runs `bin/rails db:prepare` before starting the web
#   server. db:prepare runs `db:migrate` against an existing database (picking
#   up any new migrations after a deploy) and creates+loads schema if the
#   database is empty. The Dockerfile's entrypoint also runs db:prepare; the
#   explicit command override here makes the behavior visible at the compose
#   layer and survives entrypoint changes.

x-app-env: &app-env
  RAILS_ENV: production
  RAILS_LOG_TO_STDOUT: "true"
  RAILS_SERVE_STATIC_FILES: "true"
  RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?RAILS_MASTER_KEY must be set in .env.production}
  RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
  # Which commit is running, for the navbar badge and the default crawler
  # user-agent. AppVersion reads ENV["GIT_REV"] first and otherwise falls back
  # to the .git directory, which .dockerignore keeps out of the image — so
  # without this the badge reads "version unknown". Dokku sets this var on its
  # own; a compose deploy has to pass it in:
  #   GIT_REV=$(git rev-parse HEAD) docker compose ... up --build -d
  # Left empty it degrades to the same "version unknown" as before, so an
  # operator who forgets it gets today's behaviour rather than a wrong commit.
  GIT_REV: ${GIT_REV:-}
  # host.docker.internal, not localhost: Postgres runs on the host, outside
  # compose, so `localhost` inside a container is the container itself. The
  # `extra_hosts: host-gateway` entry on app/worker makes this name resolve.
  DATABASE_URL: postgres://f_dod_user:${APP_DATABASE_PASSWORD}@host.docker.internal:5432/f_dod_production
  CACHE_DATABASE_URL: postgres://f_dod_user:${APP_DATABASE_PASSWORD}@host.docker.internal:5432/f_dod_production_cache
  QUEUE_DATABASE_URL: postgres://f_dod_user:${APP_DATABASE_PASSWORD}@host.docker.internal:5432/f_dod_production_queue
  CABLE_DATABASE_URL: postgres://f_dod_user:${APP_DATABASE_PASSWORD}@host.docker.internal:5432/f_dod_production_cable

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # postgres:
  #   image: postgres:17.4
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: f_dod_user
  #     POSTGRES_PASSWORD: ${APP_DATABASE_PASSWORD:?APP_DATABASE_PASSWORD must be set in .env.production}
  #     POSTGRES_DB: f_dod_production
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #     - ./db/postgres-init:/docker-entrypoint-initdb.d:ro
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U app -d app_production"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 20s
  #   logging: *default-logging

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: f-dod:${APP_VERSION:-latest}
    restart: unless-stopped
    # Run db:prepare on every start to pick up new migrations (and to
    # create+load schema on a fresh deployment), then start the web server.
    command: >
      sh -c "./bin/rails db:prepare && exec ./bin/thrust ./bin/rails server"
    # Passes through the runtime-only settings the app reads from ENV but that
    # x-app-env does not enumerate: CRAWLER_USER_AGENT, CRAWLER_CONTACT_URL and
    # the LLM API keys. `--env-file` alone only feeds ${...} interpolation in
    # this file; it puts nothing in the container. Keys absent from the file
    # stay absent in the container, which CrawlerIdentity depends on — an empty
    # CRAWLER_CONTACT_URL means "send none", a missing one means "use default".
    env_file:
      - .env.production
    # `environment:` wins over `env_file:`, so the values above stay
    # authoritative and .env.production cannot override the database URLs.
    environment:
      <<: *app-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "80"
    volumes:
      - app_storage:/rails/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *default-logging

  worker:
    image: f-dod:${APP_VERSION:-latest}
    restart: unless-stopped
    command: ["./bin/jobs"]
    # Same passthrough as `app` — the worker runs the crawl jobs, so it is the
    # service that actually reads CRAWLER_USER_AGENT.
    env_file:
      - .env.production
    environment:
      <<: *app-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - app_storage:/rails/storage
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${APP_HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # 127.0.0.1, not localhost: nginx listens on IPv4 only, and the image's
      # busybox wget resolves localhost to ::1 first and fails there instead of
      # falling through to the IPv4 address the way curl does.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

volumes:
  app_storage:
