name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# Three quick pushes to a PR would otherwise bill three full agent runs, two of
# them already stale. Pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test

  system-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run System Tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  # Change-request traceability gate. Judges whether this PR is linked to an
  # approved change request and whether its diff and tests match that request's
  # scope and test approach. It is not a bug hunter or a style reviewer — the
  # deterministic jobs above own everything they can decide on their own, which
  # is why this job `needs` them: a branch whose tests fail is never reviewed.
  #
  # Sourced from https://github.com/frizman21/software-factory-plugin
  # (examples/agent-review.yml). Lives in this workflow rather than its own file
  # because Actions has no cross-workflow `needs:`.
  quality:
    needs: [ test, system-test ]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write   # post the review / comment
      issues: read           # read the linked change request

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # The full anthropics/claude-code-action, not the base action: it applies
      # actor permission checks and restores project configuration from the base
      # ref, so a PR branch cannot rewrite the gate that judges it.
      - name: Quality review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Pinned by tag. Unpinned, a plugin edit silently changes what every
          # open PR is reviewed against.
          plugin_marketplaces: "https://github.com/frizman21/software-factory-plugin.git#v0.1.0"
          plugins: "sw-factory@software-factory"
          prompt: "/sw-factory:pr-quality-review ${{ github.event.pull_request.html_url }}"
          claude_args: |
            --max-turns 15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
