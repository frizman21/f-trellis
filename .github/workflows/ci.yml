name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# Three quick pushes to a PR would otherwise bill three full agent runs, two of
# them already stale. Pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test

  system-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run System Tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  # Change-request traceability gate. Judges whether this PR is linked to an
  # approved change request and whether its diff and tests match that request's
  # scope and test approach. It is not a bug hunter or a style reviewer — the
  # deterministic jobs above own everything they can decide on their own, which
  # is why this job `needs` them: a branch whose tests fail is never reviewed.
  #
  # Sourced from https://github.com/frizman21/software-factory-plugin
  # (examples/agent-review.yml). Lives in this workflow rather than its own file
  # because Actions has no cross-workflow `needs:`.
  #
  # Dependabot is excluded, and not as a convenience. The gate cannot run there
  # for two mechanical reasons — claude-code-action refuses non-human actors
  # ("Workflow initiated by non-human actor: dependabot"), and Dependabot-
  # triggered runs receive no repository secrets, so ANTHROPIC_API_KEY resolves
  # to empty. Neither is worth working around, because of the deciding reason:
  # this gate judges traceability to a change request, and a version bump has
  # none and never will. Reviewing one is a category error, not missing config.
  # Left in place, it painted every Dependabot PR with a red X that reads as
  # "reviewed and rejected" when the truth was "nobody looked, and nobody can" —
  # the exact confusion the failure-report step below exists to prevent.
  #
  # Test the PR's author, not `github.actor`: the two diverge when a human
  # re-runs a failed Dependabot job, and it is authorship that decides both
  # secret availability and whether a change request could exist.
  quality:
    needs: [ test, system-test ]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write   # post the review / comment
      issues: read           # read the linked change request
      id-token: write        # claude-code-action mints an OIDC token; without
                             # this it retries 3x and fails the job, even when
                             # anthropic_api_key is set

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Pinning happens HERE, not in the marketplace string. There is no ref
      # syntax for `claude plugin marketplace add`, and the action validates
      # URLs against /^https:\/\/....\.git$/ — a trailing `#v0.1.0` is rejected
      # outright with "Invalid marketplace URL format". Check the marketplace
      # out at the pinned ref and hand the action the resulting local path
      # instead; local paths skip URL validation and go straight to the CLI.
      - name: Check out the sw-factory marketplace at the pinned ref
        uses: actions/checkout@v7
        with:
          repository: frizman21/software-factory-plugin
          # The pin: bump deliberately, never float. A commit rather than a tag
          # because the instructions this workflow follows — the local-path
          # marketplace, the failure-report step below, and the skill's
          # never-exit-silently rule — landed after v0.1.0 was cut. Move this to
          # the tag once the plugin tags that commit.
          ref: bfd2b718ea78fa9d4ce2da381aac35dd8476a2af
          path: .sw-factory-plugin

      # The full anthropics/claude-code-action, not the base action: it applies
      # actor permission checks and restores project configuration from the base
      # ref, so a PR branch cannot rewrite the gate that judges it.
      - name: Quality review
        id: quality
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "./.sw-factory-plugin"
          plugins: "sw-factory@software-factory"
          prompt: "/sw-factory:pr-quality-review ${{ github.event.pull_request.html_url }}"
          claude_args: |
            --max-turns 15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The agent comments on what it finds. It cannot comment on its own death:
      # a bad plugin ref, an expired key, or exhausting --max-turns kills the
      # step before the skill ever posts. Without this the PR shows a red X and
      # no reason, which reads like "the code is bad" instead of "nobody looked."
      # Same marker and same --edit-last as the skill, so a failure replaces the
      # previous verdict rather than stacking under it.
      - name: Report gate failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          OUTCOME: ${{ steps.quality.outcome || 'did not run' }}
          # The PR head, not GITHUB_SHA — on pull_request that's the merge commit,
          # which is not a commit the author can find in their branch.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cat > /tmp/gate-failure.md <<EOF
          **Quality gate did not complete — this PR has not been reviewed.**

          The \`quality\` job failed before a verdict could be posted, so nothing
          here says whether the change is traceable to an approved change request.
          Treat this as *unreviewed*, not as *approved*.

          - Agent step: \`${OUTCOME}\`
          - Commit: \`${HEAD_SHA}\`
          - Logs: ${RUN_URL}

          Re-run the job once the cause is fixed. Common causes: the pinned
          marketplace ref does not exist, \`ANTHROPIC_API_KEY\` is missing or
          expired, or the agent hit \`--max-turns\`.

          <!-- sw-factory:quality -->
          EOF
          gh pr comment "$PR" -R "$REPO" \
            --edit-last --create-if-none --body-file /tmp/gate-failure.md
