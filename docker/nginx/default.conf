# nginx config for f-dod production. Sits in front of Thruster (which runs on
# port 80 inside the `app` container) and is the only service that publishes a
# port to the host.

upstream rails_app {
    server app:80;
    keepalive 32;
}

# Hide the nginx version in error pages and Server headers.
server_tokens off;

# Long timeouts for streaming responses (e.g. action cable, long jobs proxied
# through the web tier). Tighten if you don't need them.
proxy_read_timeout    300s;
proxy_send_timeout    300s;
proxy_connect_timeout 30s;

# gzip is enabled by default in the upstream image's nginx.conf for text MIME
# types. We don't override it here.

server {
    listen      80 default_server;
    server_name _;

    # Allow large uploads (Active Storage / Source ingest). Override via
    # CLIENT_MAX_BODY_SIZE if you need bigger.
    client_max_body_size 50m;

    # Forwarded-* headers so Rails sees the original scheme/host/IP. Set
    # `config.force_ssl = true` in the Rails app once a TLS proxy is added
    # in front of (or replaces) this nginx.
    #
    # $http_host, not $host: $host strips the port, so on a non-default
    # APP_HTTP_PORT (e.g. 3080) Rails would generate redirects back to the
    # bare host and send the browser to port 80. $http_host passes the Host
    # header through verbatim, port included.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header Connection        "";
    proxy_http_version 1.1;
    proxy_redirect    off;

    location / {
        proxy_pass http://rails_app;
    }

    # Surface upstream health directly without proxying the full request
    # pipeline — useful for external uptime monitors.
    location = /up {
        proxy_pass http://rails_app/up;
        access_log off;
    }
}

# To add TLS termination here, uncomment and provide certs via a bind mount
# (e.g. ./docker/nginx/certs:/etc/nginx/certs:ro). For automated certs prefer
# Caddy or certbot in a sidecar.
#
# server {
#     listen      443 ssl http2;
#     server_name your.domain;
#     ssl_certificate     /etc/nginx/certs/fullchain.pem;
#     ssl_certificate_key /etc/nginx/certs/privkey.pem;
#     ...
# }
